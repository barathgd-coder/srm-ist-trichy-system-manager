<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><script>document.documentElement.dataset.theme="dark";if(/embed/.test(location.search))document.documentElement.classList.add("embed")</script>
<meta name="theme-color" content="#F4F8FD">
<title>Attendance · SRM Institute of Science and Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></symbol>
    <symbol id="i-att" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/><path d="m9 15 2.1 2.1 4-4.2"/></symbol>
    <symbol id="i-sched" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3V12l3.2 2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.4C5 4.4 5.8 3.5 6.9 3.5H19v14H6.9c-1 0-1.9.8-1.9 1.9z"/><path d="M5 19.4c0 1 .8 1.7 1.9 1.7H19v-3.6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.3" r="3.8"/><path d="M4.6 20c.9-3.6 3.8-5.5 7.4-5.5s6.5 1.9 7.4 5.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h3.8L19 8.8a2.3 2.3 0 0 0-3.3-3.3L5 16.2z"/><path d="m14 7.2 2.8 2.8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side"><div class="side-in">
    <a class="brand" href="#/dashboard" aria-label="SRM Institute of Science and Technology, go to dashboard">
      <span class="logo-chip"><img class="logo-full" data-logo="full" alt="SRM Institute of Science and Technology"><img class="logo-seal" data-logo="seal" alt=""></span>
    </a>
    <nav class="dock" aria-label="Main">
      <a href="#/dashboard" data-nav="dashboard"><svg class="i"><use href="#i-dash"/></svg><span>Dashboard</span></a>
      <a href="#/attendance" data-nav="attendance"><svg class="i"><use href="#i-att"/></svg><span>Attendance</span></a>
      <a href="#/schedule" data-nav="schedule"><svg class="i"><use href="#i-sched"/></svg><span>Schedule</span></a>
      <a href="#/subjects" data-nav="subjects"><svg class="i"><use href="#i-book"/></svg><span>Subjects</span></a>
      <a href="#/profile" data-nav="profile"><svg class="i"><use href="#i-user"/></svg><span>Profile</span></a>
    </nav>
    <a class="side-foot" href="#/profile" aria-label="Open profile">
      <span class="avatar" aria-hidden="true">S</span>
      <span class="who"><b>Student</b><span id="footSec"></span></span>
    </a>
  </div></aside>

  <div style="min-width:0">
    <header class="topbar">
      <a href="#/dashboard" aria-label="SRM Institute of Science and Technology, go to dashboard"><span class="logo-chip"><img data-logo="full" alt="SRM Institute of Science and Technology"></span></a>
    </header>
    <main id="main"><div class="view" id="view" tabindex="-1"></div></main>
  </div>
</div>

<button class="fab" id="fab" type="button" data-act="sheet" hidden><svg class="i"><use href="#i-edit"/></svg>Request correction</button>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div><h2 id="sheetTitle">Request a correction</h2><p class="muted small" id="sheetDate" style="margin-top:4px"></p></div>
      <button class="icon-btn" type="button" data-act="close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <label class="f">Class<select id="sheetClass" required></select></label>
    <label class="f">What should be changed?<textarea id="sheetWhy" required placeholder="For example: I was present, but marked absent."></textarea></label>
    <button class="btn block" type="submit">Send request</button>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="timetable.js"></script>
<script src="app.js"></script>
</body>
</html>
